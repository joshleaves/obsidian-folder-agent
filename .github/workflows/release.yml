name: Release Obsidian plugin

on:
  push:
    tags: ['*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2 

      - name: Build plugin
        run: |
          bun ci
          bun run lint
          bun run build

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
